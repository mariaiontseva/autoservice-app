function bindVisitForm(v) {
  let photos = (v.photos || []).slice();
  let documents = (v.documents || []).slice();
  let works = worksOf(v).map(w => ({ type: w.type || '', mechanic: w.mechanic || '', cost: Number(w.cost) || 0 }));
  let parts = partsOf(v).map(p => ({ name: p.name || '', cost: Number(p.cost) || 0 }));
  // Start with one empty row so user doesn't have to click "Add" first
  if (!works.length) works.push({ type: '', mechanic: '', cost: 0 });
  if (!parts.length) parts.push({ name: '', cost: 0 });

  const worksEdit = document.getElementById('works-edit');
  const worksTotalEl = document.getElementById('works-total');
  const partsEdit = document.getElementById('parts-edit');
  const partsTotalEl = document.getElementById('parts-total');

  const renderWorks = () => {
    if (!works.length) {
      worksEdit.innerHTML = `<div class="works-edit-empty">Пока работ нет — нажмите «+ Добавить работу»</div>`;
    } else {
      worksEdit.innerHTML = works.map((w, i) => `
        <div class="works-edit-row" data-i="${i}">
          <input class="work-type-input" data-k="type" autocomplete="off" placeholder="Например, замена колодок" value="${e(w.type)}">
          <input class="work-mech-input" data-k="mechanic" autocomplete="off" placeholder="Мастер" value="${e(w.mechanic)}">
          <input class="work-cost-input" data-k="cost" type="number" min="0" step="0.01" placeholder="0" value="${w.cost || ''}">
          <button type="button" class="work-remove" data-rm="${i}" aria-label="Удалить работу" title="Удалить">×</button>
        </div>
      `).join('');
      worksEdit.querySelectorAll('input').forEach(inp => {
        inp.addEventListener('input', () => {
          const row = inp.closest('.works-edit-row');
          const i = Number(row.dataset.i);
          const k = inp.dataset.k;
          works[i][k] = (k === 'cost') ? (Number(inp.value) || 0) : inp.value;
          if (k === 'cost') updateWorksTotal();
        });
      });
      worksEdit.querySelectorAll('[data-rm]').forEach(btn => {
        btn.addEventListener('click', () => {
          works.splice(Number(btn.dataset.rm), 1);
          renderWorks(); updateWorksTotal();
        });
      });
    }
  };
  const updateWorksTotal = () => {
    const sum = works.reduce((s, w) => s + (Number(w.cost) || 0), 0);
    worksTotalEl.textContent = fmtMoney(sum);
  };
  document.getElementById('works-add').addEventListener('click', () => {
    works.push({ type: '', mechanic: '', cost: 0 });
    renderWorks(); updateWorksTotal();
    const inputs = worksEdit.querySelectorAll('.work-type-input');
    if (inputs.length) inputs[inputs.length - 1].focus();
  });
  renderWorks(); updateWorksTotal();

  const renderParts = () => {
    if (!parts.length) {
      partsEdit.innerHTML = `<div class="works-edit-empty">Пока деталей нет — нажмите «+ Добавить деталь»</div>`;
    } else {
      partsEdit.innerHTML = parts.map((p, i) => `
        <div class="parts-edit-row" data-i="${i}">
          <input class="part-name-input" data-k="name" autocomplete="off" placeholder="Например, Колодки Akebono передние" value="${e(p.name)}">
          <input class="part-cost-input work-cost-input" data-k="cost" type="number" min="0" step="0.01" placeholder="0" value="${p.cost || ''}">
          <button type="button" class="work-remove" data-rm="${i}" aria-label="Удалить деталь" title="Удалить">×</button>
        </div>
      `).join('');
      partsEdit.querySelectorAll('input').forEach(inp => {
        inp.addEventListener('input', () => {
          const row = inp.closest('.parts-edit-row');
          const i = Number(row.dataset.i);
          const k = inp.dataset.k;
          parts[i][k] = (k === 'cost') ? (Number(inp.value) || 0) : inp.value;
          if (k === 'cost') updatePartsTotal();
        });
      });
      partsEdit.querySelectorAll('[data-rm]').forEach(btn => {
        btn.addEventListener('click', () => {
          parts.splice(Number(btn.dataset.rm), 1);
          renderParts(); updatePartsTotal();
        });
      });
    }
  };
  const updatePartsTotal = () => {
    const sum = parts.reduce((s, p) => s + (Number(p.cost) || 0), 0);
    partsTotalEl.textContent = fmtMoney(sum);
  };
  document.getElementById('parts-add').addEventListener('click', () => {
    parts.push({ name: '', cost: 0 });
    renderParts(); updatePartsTotal();
    const inputs = partsEdit.querySelectorAll('.part-name-input');
    if (inputs.length) inputs[inputs.length - 1].focus();
  });
  renderParts(); updatePartsTotal();

  // Suggestions: load saved state once, then attach a custom dropdown
  loadVisitSuggestionBase().catch(err => console.warn('Suggestion load failed:', err));

  const dd = document.getElementById('suggest-dd');
  let activeInput = null;
  let activeIdx = -1;

  function suggestionsFor(inp) {
    const focusedRow = inp.closest('[data-i]');
    const focusedI = focusedRow ? Number(focusedRow.dataset.i) : -1;
    let saved, current;
    if (inp.classList.contains('work-type-input')) {
      saved = suggestState.workTypes;
      current = works.filter((_, i) => i !== focusedI).map(w => w.type);
    } else if (inp.classList.contains('work-mech-input')) {
      saved = suggestState.mechanics;
      current = works.filter((_, i) => i !== focusedI).map(w => w.mechanic);
    } else if (inp.classList.contains('part-name-input')) {
      saved = suggestState.partNames;
      current = parts.filter((_, i) => i !== focusedI).map(p => p.name);
    } else return [];
    const set = new Set(saved);
    current.forEach(v => { if (v && String(v).trim()) set.add(String(v).trim()); });
    return [...set].filter(Boolean).sort((a, b) => a.localeCompare(b, 'ru'));
  }

  function highlightMatch(text, query) {
    if (!query) return e(text);
    const t = text.toLowerCase();
    const q = query.toLowerCase();
    const idx = t.indexOf(q);
    if (idx < 0) return e(text);
    return e(text.slice(0, idx)) + `<span class="match">${e(text.slice(idx, idx + query.length))}</span>` + e(text.slice(idx + query.length));
  }

  function showDropdown(inp) {
    const value = inp.value.trim();
    if (!value) { hideDropdown(); return; }
    let items = suggestionsFor(inp);
    const q = value.toLowerCase();
    items = items.filter(s => s.toLowerCase().includes(q) && s.toLowerCase() !== q);
    if (!items.length) { hideDropdown(); return; }
    items = items.slice(0, 8);
    dd.innerHTML = items.map((s, i) => `<div class="suggest-item${i === 0 ? ' is-active' : ''}" data-val="${e(s)}">${highlightMatch(s, value)}</div>`).join('');
    const rect = inp.getBoundingClientRect();
    dd.style.left = rect.left + 'px';
    dd.style.top = (rect.bottom + 2) + 'px';
    dd.style.width = rect.width + 'px';
    dd.hidden = false;
    activeInput = inp;
    activeIdx = 0;
  }

  function hideDropdown() {
    dd.hidden = true;
    activeInput = null;
    activeIdx = -1;
  }

  function selectSuggestion(value) {
    if (!activeInput) return;
    activeInput.value = value;
    activeInput.dispatchEvent(new Event('input', { bubbles: true }));
    hideDropdown();
  }

  dd.addEventListener('mousedown', (ev) => ev.preventDefault()); // keep input focus
  dd.addEventListener('click', (ev) => {
    const item = ev.target.closest('.suggest-item');
    if (item) selectSuggestion(item.dataset.val);
  });

  const visitFormEl = document.getElementById('visit-form');
  visitFormEl.addEventListener('input', (ev) => {
    if (ev.target.matches('.work-type-input, .work-mech-input, .part-name-input')) {
      showDropdown(ev.target);
    }
  });
  visitFormEl.addEventListener('focusout', (ev) => {
    if (ev.target.matches('.work-type-input, .work-mech-input, .part-name-input')) {
      setTimeout(() => { if (document.activeElement !== ev.target) hideDropdown(); }, 100);
    }
  });
  visitFormEl.addEventListener('keydown', (ev) => {
    if (!activeInput || dd.hidden) return;
    const items = dd.querySelectorAll('.suggest-item');
    if (!items.length) return;
    if (ev.key === 'ArrowDown') {
      ev.preventDefault();
      activeIdx = (activeIdx + 1) % items.length;
      items.forEach((it, i) => it.classList.toggle('is-active', i === activeIdx));
      items[activeIdx].scrollIntoView({ block: 'nearest' });
    } else if (ev.key === 'ArrowUp') {
      ev.preventDefault();
      activeIdx = (activeIdx - 1 + items.length) % items.length;
      items.forEach((it, i) => it.classList.toggle('is-active', i === activeIdx));
      items[activeIdx].scrollIntoView({ block: 'nearest' });
    } else if (ev.key === 'Enter') {
      ev.preventDefault();
      if (items[activeIdx]) selectSuggestion(items[activeIdx].dataset.val);
    } else if (ev.key === 'Escape') {
      hideDropdown();
    }
  });
  window.addEventListener('scroll', hideDropdown, true);
  const photoGrid = document.getElementById('photo-grid');
  const docList = document.getElementById('docs-edit-list');
  const photoStatus = document.getElementById('photo-status');
  const docStatus = document.getElementById('doc-status');
  const setStatus = (el, msg) => { if (msg) { el.textContent = msg; el.hidden = false; } else { el.hidden = true; } };

  const renderPhotos = () => {
    photoGrid.innerHTML = photos.map((p, i) => {
      const isVideo = mediaKind(p) === 'video';
      const src = p.url || p.dataUrl || '';
      const media = isVideo
        ? `<video src="${e(src)}" preload="metadata" muted playsinline controls></video>`
        : `<img src="${e(src)}" alt="" loading="lazy">`;
      return `
        <div class="photo-edit${p.pendingId?' pending':''}${isVideo?' is-video':''}" data-i="${i}">
          <button type="button" class="photo-remove" data-rm="${i}" aria-label="Удалить">×</button>
          ${media}
          <textarea class="caption-input" data-cap="${i}" placeholder="Подпись…">${e(p.comment||'')}</textarea>
        </div>
      `;
    }).join('');
    photoGrid.querySelectorAll('[data-rm]').forEach(b => b.addEventListener('click', () => {
      const idx = Number(b.dataset.rm);
      const removed = photos[idx];
      if (removed?.pendingId) { const qid = parseInt(removed.pendingId.slice(1), 10); queue.del(qid).catch(()=>{}); }
      photos.splice(idx, 1);
      renderPhotos();
    }));
    photoGrid.querySelectorAll('[data-cap]').forEach(t => t.addEventListener('input', () => { photos[Number(t.dataset.cap)].comment = t.value; }));
  };

  const renderDocs = () => {
    docList.innerHTML = documents.map((d, i) => `
      <div class="doc-edit${d.pendingId?' pending':''}" data-i="${i}">
        <span class="doc-icon">${d.pendingId ? '⏳' : docIcon(d.name)}</span>
        ${d.url ? `<a href="${e(d.url)}" target="_blank" rel="noopener" class="doc-name">${e(d.name)}</a>` : `<span class="doc-name">${e(d.name)}</span>`}
        <span class="doc-meta">${d.pendingId ? 'ожидает сети' : fmtBytes(d.bytes || d.size)}</span>
        <button type="button" class="doc-remove" data-rm="${i}" aria-label="Удалить">×</button>
      </div>
    `).join('');
    docList.querySelectorAll('[data-rm]').forEach(b => b.addEventListener('click', () => {
      const idx = Number(b.dataset.rm);
      const removed = documents[idx];
      if (removed?.pendingId) { const qid = parseInt(removed.pendingId.slice(1), 10); queue.del(qid).catch(()=>{}); }
      documents.splice(idx, 1);
      renderDocs();
    }));
  };

  renderPhotos();
  renderDocs();

  const handlePhotos = async (files) => {
    if (!files.length) return;
    setStatus(photoStatus, `Загрузка ${files.length} фото в облако…`);
    for (let i = 0; i < files.length; i++) {
      const file = files[i];
      setStatus(photoStatus, `Загрузка ${i + 1} из ${files.length}…`);
      try {
        const photo = await uploadPhotoFile(file);
        photo.comment = '';
        photos.push(photo);
        renderPhotos();
      } catch (err) {
        console.error('photo upload error', err);
        alert('Не удалось загрузить ' + file.name + ':\n' + err.message);
      }
    }
    setStatus(photoStatus, '');
  };

  const handleDocs = async (files) => {
    if (!files.length) return;
    setStatus(docStatus, `Загрузка ${files.length} документ${files.length === 1 ? 'а' : 'ов'}…`);
    for (let i = 0; i < files.length; i++) {
      const file = files[i];
      setStatus(docStatus, `Загрузка ${i + 1} из ${files.length}…`);
      try {
        const doc = await uploadDocumentFile(file);
        documents.push(doc);
        renderDocs();
      } catch (err) {
        console.error('doc upload error', err);
        alert('Не удалось загрузить ' + file.name + ':\n' + err.message);
      }
    }
    setStatus(docStatus, '');
  };

  const photoInput = document.getElementById('photo-input');
  photoInput.addEventListener('change', async (ev) => { await handlePhotos(Array.from(ev.target.files || [])); photoInput.value = ''; });
  const docInput = document.getElementById('doc-input');
  docInput.addEventListener('change', async (ev) => { await handleDocs(Array.from(ev.target.files || [])); docInput.value = ''; });

  document.querySelectorAll('.photo-upload').forEach(zone => {
    zone.addEventListener('dragover', e => { e.preventDefault(); zone.style.borderColor = 'var(--seal)'; });
    zone.addEventListener('dragleave', () => { zone.style.borderColor = ''; });
  });
  document.querySelector('label[for="photo-input"]').addEventListener('drop', async (ev) => {
    ev.preventDefault(); ev.currentTarget.style.borderColor = '';
    const files = Array.from(ev.dataTransfer.files || []).filter(f => f.type.startsWith('image/') || f.type.startsWith('video/'));
    await handlePhotos(files);
  });
  document.querySelector('label[for="doc-input"]').addEventListener('drop', async (ev) => {
    ev.preventDefault(); ev.currentTarget.style.borderColor = '';
    const files = Array.from(ev.dataTransfer.files || []);
    await handleDocs(files);
  });

  document.getElementById('visit-form').addEventListener('submit', async (ev) => {
    ev.preventDefault();
    const data = Object.fromEntries(new FormData(ev.target));
    data.card_id = v.card_id;
    if (data.mileage) data.mileage = Number(data.mileage); else delete data.mileage;
    data.prepayment = Number(data.prepayment) || 0;
    if (data.visit_date) data.visit_date = new Date(data.visit_date + 'T12:00:00').toISOString();
    data.photos = photos;
    data.documents = documents;
    // Works: drop blank rows, normalize numbers
    const cleanWorks = works
      .map(w => ({ type: (w.type || '').trim(), mechanic: (w.mechanic || '').trim(), cost: Number(w.cost) || 0 }))
      .filter(w => w.type || w.mechanic || w.cost > 0);
    // Parts: drop blank rows
    const cleanParts = parts
      .map(p => ({ name: (p.name || '').trim(), cost: Number(p.cost) || 0 }))
      .filter(p => p.name || p.cost > 0);
    data.works = cleanWorks;
    data.parts = cleanParts;
    const wSum = cleanWorks.reduce((s, w) => s + w.cost, 0);
    const pSum = cleanParts.reduce((s, p) => s + p.cost, 0);
    data.cost = wSum + pSum;
    // Delivery timestamp: set when transitioning to "delivered", clear when leaving
    const wasDelivered = v.status === 'delivered';
    const isDelivered  = data.status === 'delivered';
    if (isDelivered && !wasDelivered) data.delivered_at = new Date().toISOString();
    else if (isDelivered && wasDelivered) data.delivered_at = v.delivered_at || new Date().toISOString();
    else data.delivered_at = null; // explicit null so merge clears it
    // Drop legacy fields so they don't shadow the new model
    delete data.work_done;
    delete data.mechanic;
    delete data.parts_to_order;
    if (v.id) {
      const merged = { ...v, ...data };
      delete merged.work_done; delete merged.mechanic; delete merged.parts_to_order;
      if (merged.delivered_at === null) delete merged.delivered_at;
      await repo.put('visits', merged); flash('Визит сохранён');
    } else {
      if (data.delivered_at === null) delete data.delivered_at;
      await repo.add('visits', data); flash('Визит создан');
    }
    location.hash = '#/cards/' + v.card_id;
  });
}

async function clearDemoData() {
  const [cards, visits] = await Promise.all([repo.list('cards'), repo.list('visits')]);
  const demoCards = cards.filter(c => c.is_demo);
  const demoVisits = visits.filter(v => v.is_demo);
  for (const v of demoVisits) await repo.del('visits', v.id);
  for (const c of demoCards) await repo.del('cards', c.id);
  return { cards: demoCards.length, visits: demoVisits.length };
}

// ═══ Birthday popup (first launch) ════════════════════
const BDAY_FLAG = 'garage_birthday_shown';
function fireConfetti() {
  const colors = ['#a8462a', '#5a6a23', '#1c1917', '#f4f1e8', '#d4cdb8', '#c25538'];
  confetti({ particleCount: 140, spread: 80, startVelocity: 50, origin: { y: 0.55 }, colors, scalar: 1.1 });
  setTimeout(() => confetti({ particleCount: 80, angle: 60, spread: 70, origin: { x: 0, y: 0.7 }, colors }), 200);
  setTimeout(() => confetti({ particleCount: 80, angle: 120, spread: 70, origin: { x: 1, y: 0.7 }, colors }), 200);
  setTimeout(() => confetti({ particleCount: 60, spread: 100, startVelocity: 35, origin: { y: 0.4 }, colors }), 600);
}

function maybeShowBirthday() {
  if (localStorage.getItem(BDAY_FLAG)) return Promise.resolve();
  return new Promise((resolve) => {
    const modal = document.getElementById('birthday-modal');
    const giftEl = document.getElementById('gift-icon');
    const stageGift = modal.querySelector('.stage-gift');
    const stageMsg = modal.querySelector('.stage-message');
    const openBtn = document.getElementById('bday-open');

    modal.hidden = false;

    const openGift = () => {
      giftEl.classList.add('opening');
      // Lid + bow lift, body bounces, light burst — total ~1.1s
      setTimeout(() => fireConfetti(), 700);
      setTimeout(() => giftEl.classList.add('fading'), 950);
      setTimeout(() => {
        stageGift.hidden = true;
        stageMsg.hidden = false;
      }, 1300);
    };
    giftEl.addEventListener('click', openGift, { once: true });
    giftEl.addEventListener('keydown', (e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); openGift(); } }, { once: true });

    openBtn.addEventListener('click', () => {
      modal.classList.add('closing');
      localStorage.setItem(BDAY_FLAG, '1');
      setTimeout(() => {
        modal.hidden = true;
        modal.classList.remove('closing');
        resolve();
      }, 500);
    }, { once: true });
  });
}

async function maybeAutoSeed() {
  if (localStorage.getItem('garage_firestore_seeded')) return;
  const cards = await repo.list('cards');
  if (cards.length > 0) { localStorage.setItem('garage_firestore_seeded', '1'); return; }
  await seedDemo();
  localStorage.setItem('garage_firestore_seeded', '1');
}

// ═══ Backup / Restore / Reseed ════════════════════════
document.getElementById('backup').addEventListener('click', async (ev) => {
  ev.preventDefault();
  const data = { version: 1, schema: 'cards/visits', exported_at: new Date().toISOString(), cards: await repo.list('cards'), visits: await repo.list('visits') };
  const blob = new Blob([JSON.stringify(data)], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `kartoteka-${new Date().toISOString().slice(0,10)}.json`;
  a.click();
  URL.revokeObjectURL(a.href);
  flash('Бэкап сохранён');
});

document.getElementById('restore').addEventListener('click', (ev) => { ev.preventDefault(); document.getElementById('restore-input').click(); });
document.getElementById('restore-input').addEventListener('change', async (ev) => {
  const file = ev.target.files[0];
  if (!file) return;
  if (!confirm('ВНИМАНИЕ: восстановление перезапишет все текущие данные. Продолжить?')) { ev.target.value = ''; return; }
  try {
    const data = JSON.parse(await file.text());
    if (data.schema !== 'cards/visits') { if (!confirm('Файл другого формата. Импортировать всё равно?')) return; }
    await Promise.all(['cards','visits'].map(s => repo.clear(s)));
    for (const c of data.cards  || []) await repo.put('cards', c);
    for (const v of data.visits || []) await repo.put('visits', v);
    flash('Восстановлено');
    setTimeout(() => location.reload(), 600);
  } catch (err) { alert('Ошибка: ' + err.message); }
});

document.getElementById('clear-demo').addEventListener('click', async (ev) => {
  ev.preventDefault();
  if (!confirm('Удалить только демо-клиентов (Иванов, Петрова и др)? Ваши собственные карточки останутся нетронутыми.')) return;
  const { cards, visits } = await clearDemoData();
  if (cards === 0 && visits === 0) {
    flash('Демо-данных нет');
  } else {
    flash(`Удалено: ${cards} клиент${cards === 1 ? '' : cards > 1 && cards < 5 ? 'а' : 'ов'}`);
    setTimeout(() => location.reload(), 800);
  }
});

// ═══ One-shot card migrations ═════════════════════════
// Normalizes plates (strips spaces) for ALL cards and backfills `year` for
// known demo cards by surname+make match. Safe to ship — uses a localStorage
// flag so it runs at most once per browser. Bump the flag name to re-run.
async function migrateCardsOnce() {
  const FLAG = 'garage_migrate_plate_year_v1';
  if (localStorage.getItem(FLAG)) return;
  const demoYears = {
    'Иванов|Toyota': 2018,
    'Петрова|Volkswagen': 2019,
    'Сидоров|Hyundai': 2020,
    'Козлов|Lada': 2022,
    'Морозова|Kia': 2021,
    'Николаев|BMW': 2017,
    'Фёдорова|Ford': 2016,
  };
  const cards = await repo.list('cards');
  let updated = 0;
  for (const c of cards) {
    let dirty = false;
    const next = { ...c };
    if (c.plate) {
      const n = normalizePlate(c.plate);
      if (n !== c.plate) { next.plate = n; dirty = true; }
    }
    const key = `${c.surname}|${c.make}`;
    if (demoYears[key] && !c.year) { next.year = demoYears[key]; dirty = true; }
    if (dirty) { await repo.put('cards', next); updated++; }
  }
  localStorage.setItem(FLAG, '1');
  if (updated > 0) console.log(`migrateCardsOnce: updated ${updated} card(s)`);
}

// ═══ Boot ═════════════════════════════════════════════
window.addEventListener('DOMContentLoaded', async () => {
  await maybeShowBirthday();
  try { await maybeAutoSeed(); } catch (err) { console.error('Auto-seed failed:', err); }
  try { await migrateCardsOnce(); } catch (err) { console.error('Migration failed:', err); }
  if (!location.hash) location.hash = '#/'; else dispatch();
  // Try to flush any queued offline uploads after the app is up
  setTimeout(() => processPendingUploads(true).catch(() => {}), 2500);
});
